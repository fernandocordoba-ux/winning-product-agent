# =============================================================================
# PRODUCTION CONFIG production-v12 — IMMUTABLE (owner-approved promotion)
# created_at: 2026-10-03T03:17:25.417020+00:00
# source_calibration_report: owner-approved change of production-v11 (approved by owner at 2026-10-03T03:10Z)
# change_summary:
#   - query_plan.deep_selection: preliminary_wps -> preliminary_only (owner approved)
# Do not edit. A new change creates config/production/v<N+1>/.
# =============================================================================

runtime:
  market: US
  live_mode: false
  dry_run: true
  explicit_live_confirmation: false
limits:
  discovery_max_products: 100
  deep_analysis_max_products: 18
  amazon_validation_max_products: 3
  bvs_max_products: 3
safety:
  preserve_raw_data: true
  append_only_history: true
  block_secrets_in_outputs: true
  require_credit_check: true
  min_balance_reserve: 5.0
  estimated_credits_per_query: 4.0
query_plan:
  discovery_mode: lenses
  discovery_categories:
  - home
  - kitchen
  deep_batch_size: 1
  amazon_batch_size: 2
  max_credits_for_run: 82
  estimated_credits:
    discovery: 4.0
    deep_analysis: 3.6
    amazon_validation: 4.0
  guardrails:
    max_queries_per_run: 22
    max_provider_queries:
      kalopilot: 22
    max_failed_queries: 2
    max_retry_count: 0
    note: sized from the approved limits; stop new paid queries, keep completed data,
      PARTIAL report
  discovery_exclude_established_brands: true
  deep_selection: "preliminary_only"
  deep_exclude_keywords:
  - halloween
  - christmas
  - xmas
  - thanksgiving
  - easter
  - valentine
  - advent
  - santa
  discovery_lenses:
  - proven
  discovery_subniches:
    home:
    - 'storage & organization: closet, drawer, shelf and bathroom organizers, hooks,
      racks and hangers (non-electric; no glass or ceramic; no oversized furniture)'
    - 'cleaning tools: brushes, mops, cloths, dusters, squeegees and lint removers
      (tools only; no liquids, sprays or chemicals; non-electric)'
    kitchen:
    - 'kitchen tools & gadgets: utensils, peelers, choppers, graters, measuring and
      prep tools (non-electric; no glass or ceramic)'
    - 'kitchen storage & organization: food storage containers, racks, drawer, sink
      and pantry organizers (not glass or ceramic; no oversized items)'
  prefer_new_days: 14
  target_candidates: 10
allowed_markets:
- US
provider:
  name: kalopilot
  credential_sources:
    env:
    - KALOPILOT_TOKEN
    - KALODATA_API_KEY
    file: ~/.kalopilot/token
paths:
  raw: data/production/raw
  processed: data/production/processed
  history: data/production/history
  reports: reports/production
  runs: runs/production
  cache: data/production/raw
e2e:
  step: PRODUCTION
  confirmation_phrase: CONFIRM PRODUCTION LIVE RUN
  supplier_products_max: 3
  supplier_offers_per_product_max: 5
  competitor_products_max: 3
  competitors_per_product_max: 10
  creative_products_max: 3
  creatives_per_product_max: 20
  final_decision_max_products: 18
  layer_product_order: discovery PASS before REVIEW, then WPS desc, WPS Confidence
    desc, product_id
cache_policy:
  discovery_ttl_hours: 24
  deep_ttl_hours: 24
  amazon_ttl_hours: 24
  cache_key: query sha256 + prompt_version
  reuse_across_environments: false
  note: only PRODUCTION-tagged raw answers under data/production/raw are reused
provider_retry:
  max_retries: 0
  retry_on: []
  note: no automatic re-buy of a paid query
credit_safety:
  min_balance_reserve: 5.0
  max_credits_for_run: 82
  free_balance_check: true
history_settings:
  path: data/production/history
  append_only: true
  dedupe: source_snapshot_hash
  decision_history: true
  environment: PRODUCTION
report_settings:
  dir: reports/production
  dated_never_overwritten: true
  latest_files:
  - latest-winning-products.md
  - latest-final-decision.md
  shortlist_max: 3
  shortlist_only_state: READY_FOR_PRODUCT_VALIDATION
degraded_mode:
  kalopilot:
    critical: true
    on_unavailable: BLOCK_RUN
    on_degraded: CONTINUE_WITH_WARNING
  amazon:
    mandatory: false
    on_unavailable: CONTINUE
    effect: cross-platform demand UNKNOWN (never estimated)
  supplier:
    on_unavailable: CONTINUE_NO_READY
    on_degraded: CONTINUE
    effect: READY requires supplier economics (decision rules ready.require_supplier_economics)
  competitor:
    on_unavailable: CONTINUE_REDUCED_CONFIDENCE
    on_degraded: CONTINUE_REDUCED_CONFIDENCE
    decision_confidence_penalty: 10
    effect: Decision Confidence -10 for products without competitor evidence
  creative:
    on_unavailable: CONTINUE
    effect: creative dimension UNKNOWN

production_meta:
  config_version: production-v12
  created_at: '2026-10-03T03:17:25.417020+00:00'
  source_calibration_report: owner-approved change of production-v11 (approved by owner
    at 2026-10-03T03:10Z)
  change_summary:
  - 'query_plan.deep_selection: preliminary_wps -> preliminary_only (owner approved)'
  derived_from: production-v11
