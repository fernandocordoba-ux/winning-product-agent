# =============================================================================
# Unified Decision Engine — Step Z (decision_rules_version: Z-v1)
# =============================================================================
# scripts/decision_engine.py combines every research layer WITHOUT a weighted mega-score:
#   hard gates  ->  6 separately visible dimensions (STRONG / ACCEPTABLE / WEAK / UNKNOWN)
#   ->  one of 5 decision states  ->  shortlist (max 3, READY only)
# It never changes an existing score formula, never launches or buys a product and never
# calls a product a guaranteed / certain winner.
# =============================================================================
decision_rules_version: "Z-v1"

states: [READY_FOR_PRODUCT_VALIDATION, PROMISING_NEEDS_VALIDATION, WATCHLIST, REJECT, INSUFFICIENT_DATA]
forbidden_language: [GUARANTEED_WINNER, CERTAIN_WINNER, 100_PERCENT_PROFITABLE, "guaranteed winner", "certain winner"]

# ----------------------------------------------------------------------------- minimum evidence (Stage 3)
# Only applied to dimensions whose data exists (a missing optional layer is UNKNOWN, not a failure).
minimum_confidence:
  wps: 60
  momentum: 60
  amazon: 50
  bvs: 50
  supplier: 50
  competitor: 50
  creative: 50

# ----------------------------------------------------------------------------- hard gates (Stage 2)
# action: reject      -> REJECT (severe, evidence-based)
# action: block_ready -> cannot be READY; becomes a validation task (never a reject on its own)
# A gate only fires on POSITIVE evidence; a missing optional metric never fires a gate.
hard_gates:
  NEGATIVE_CONTRIBUTION_MARGIN:      { action: reject, below: 0 }                 # only when contribution margin is known
  UNRELIABLE_PRODUCT_MATCH:          { action: reject }                           # deep record != discovery product (identity conflict)
  REGULATED_PRODUCT:                 { action: reject, flags: [REGULATED_PRODUCT] }            # BVS compliance evidence
  REGULATED_REVIEW_REQUIRED:         { action: block_ready, flags: [REGULATED_REVIEW_REQUIRED, AD_POLICY_REVIEW_REQUIRED] }
  IP_REVIEW_REQUIRED:                { action: block_ready, flags: [IP_REVIEW_REQUIRED], resolved_by: ip_trademark_check }
  COUNTERFEIT_REVIEW_REQUIRED:       { action: block_ready, flags: [COUNTERFEIT_REVIEW_REQUIRED], severe_action: reject, resolved_by: ip_trademark_check }
  EXTREME_COMPETITION_WEAK_DEMAND:   { action: reject, flags: [EXTREME_DIRECT_COMPETITION, EXTREME_SATURATION, EXTREME_COMPETITION] }
  DEMAND_DECLINING:                  { action: reject, trend: DECLINING, growth_at_most: -20 }
  CREATOR_DEPENDENCY_WEAK_BROADER:   { action: reject, flags: [CREATOR_DEPENDENCY], max_creators: 10 }
  VIDEO_DEPENDENCY_WEAK_BROADER:     { action: reject, flags: [VIDEO_DEPENDENCY], max_videos: 10 }
  VERY_SLOW_DELIVERY:                { action: reject }                           # the SELECTED supplier offer is very slow
  SUPPLIER_MATCH_UNRELIABLE:         { action: block_ready }                      # offers exist but none is a reliable match
  CRITICAL_DATA_INTEGRITY_ERROR:     { action: reject }                           # e.g. non-LIVE record in a LIVE decision

# ----------------------------------------------------------------------------- dimensions (Stages 4-5)
dimensions:
  market_momentum:                      # WPS, Momentum Score, daily trend
    strong:     { wps_min: 70, momentum_min_if_known: 60 }
    acceptable: { wps_min: 55 }
    declining_trend_caps_at: ACCEPTABLE # DECLINING daily trend: never STRONG
    momentum_weak_below: 40             # a known momentum below this caps the dimension at ACCEPTABLE
  cross_platform_demand:                # AVS, Amazon Confidence
    strong:     { avs_min: 70, confidence_min: 60 }
    acceptable: { avs_min: 50 }
  commercial_viability:                 # BVS, margins, supplier economics
    require_supplier_economics: true    # product_cost + shipping unknown -> UNKNOWN (never guessed)
    strong:     { bvs_min: 70, gross_margin_min: 40 }
    acceptable: { bvs_min: 55, gross_margin_min: 30 }
  competitive_environment:              # Competitor Saturation / Opportunity
    strong:     { opportunity_min: 60, saturation_max: 50 }
    acceptable: { opportunity_min: 45, saturation_max: 70 }
    compression_caps_at: ACCEPTABLE     # PRICE_COMPRESSION flag: never STRONG
  creative_opportunity:                 # Creative Saturation / Opportunity
    strong:     { opportunity_min: 60, saturation_max: 55 }
    acceptable: { opportunity_min: 45, saturation_max: 75 }
  evidence_quality:                     # all known layer confidences vs minimum_confidence
    core_layer: wps                     # WPS Confidence unknown -> UNKNOWN; below its minimum -> WEAK
    acceptable_min_passing_share: 0.5   # >= half of the known layer confidences meet their minimum
    strong_margin: 20                   # STRONG: every known confidence >= its minimum + 20 ...
    strong_min_known_layers: 5          # ... and at least 5 layers known

# ----------------------------------------------------------------------------- decision rules (Stages 6-10)
decision:
  insufficient_if_unknown: [market_momentum]          # cannot decide without TikTok market evidence
  insufficient_if_unknown_at_least: 4                 # of the 5 non-evidence dimensions
  major_dimensions: [market_momentum, cross_platform_demand, commercial_viability, competitive_environment]
  reject_if_weak_major_at_least: 2
  ready:
    require_in:
      market_momentum: [STRONG, ACCEPTABLE]
      commercial_viability: [STRONG, ACCEPTABLE]
      competitive_environment: [STRONG, ACCEPTABLE]
      creative_opportunity: [STRONG, ACCEPTABLE]
      evidence_quality: [STRONG, ACCEPTABLE]
    forbid:
      cross_platform_demand: [WEAK]                   # Amazon optional (UNKNOWN allowed), but not WEAK
    require_supplier_economics: true
  promising:
    require_in:
      market_momentum: [STRONG, ACCEPTABLE]
    forbid_weak: [commercial_viability, competitive_environment, creative_opportunity, cross_platform_demand, evidence_quality]

# ----------------------------------------------------------------------------- Decision Confidence (Stage 13)
# Confidence in the DECISION, not a product score. Never uses performance values (WPS, BVS, ...).
decision_confidence:
  components:
    core_dimension_coverage: { points: 30 }   # known dimensions / 6
    layer_confidences:       { points: 25 }   # mean of known layer confidences x share of layers known
    provenance_completeness: { points: 15 }   # share of key metrics with provenance AVAILABLE / DERIVED
    reliable_sources:        { points: 15 }   # layers with confidence >= its minimum / 5 (capped)
    historical_depth:        { points: 15 }   # history observations / 3 (capped)
  history_full_at: 3
  sources_full_at: 5

# ----------------------------------------------------------------------------- shortlist (Stage 14)
shortlist:
  max_products: 3
  only_state: READY_FOR_PRODUCT_VALIDATION
  order_by: [market_momentum, commercial_viability, decision_confidence, competitive_opportunity, creative_opportunity, product_id]

# ----------------------------------------------------------------------------- manual validation (Stage 15)
checklist: [supplier_sample, final_shipping_quote, final_landed_cost, margin_verification, meta_ads_review,
            shopify_competitor_review, creative_angle_review, ip_trademark_check, returns_risk, product_quality_check,
            customer_support_complexity, packaging_considerations]

# ----------------------------------------------------------------------------- tasks / next queries (Stages 7, 10)
# Text only: the engine never runs a query. Paid queries still need the explicit live-run confirmation.
validation_tasks:
  supplier_economics:      "Import supplier offers with product_cost and shipping_cost (suppliers import <csv|json>); no orders, no supplier contact"
  commercial_viability:    "Re-run BVS with the selected supplier offer; confirm BVS Confidence >= minimum"
  competitive_environment: "Import competitor research (competitors import <csv|json>) so Competitor Confidence >= minimum"
  creative_opportunity:    "Import creative research (creatives import / creatives from-kalopilot <product_id>, free, saved data only)"
  cross_platform_demand:   "Optional: Amazon validation (paid KaloPilot query) to add cross-platform evidence"
  evidence_quality:        "Raise the weakest layer confidence above its minimum (see evidence matrix)"
  market_momentum:         "A further deep-analysis observation (paid) to confirm WPS / Momentum"
  REGULATED_REVIEW_REQUIRED: "Manual compliance / ad-policy review of the product category"
  IP_REVIEW_REQUIRED:        "Manual IP / trademark check (checklist: ip_trademark_check)"
  COUNTERFEIT_REVIEW_REQUIRED: "Manual counterfeit / brand-authorization review (checklist: ip_trademark_check)"
  SUPPLIER_MATCH_UNRELIABLE: "Find a supplier offer that matches the exact product (match >= 75)"
next_queries:                         # INSUFFICIENT_DATA: what would close the gap (never executed automatically)
  deep_analysis: { action: "KaloPilot deep analysis of this product", paid: true, est_credits: 2.5 }
  history:       { action: "A second deep-analysis observation >= 1 day later (Momentum needs >= 2 snapshots)", paid: true, est_credits: 2.5 }
  amazon:        { action: "KaloPilot Amazon validation", paid: true, est_credits: 4.0 }
  supplier:      { action: "Manual supplier offer import", paid: false }
  competitor:    { action: "Manual competitor research import", paid: false }
  creative:      { action: "creatives from-kalopilot <product_id> (saved data) or manual import", paid: false }
