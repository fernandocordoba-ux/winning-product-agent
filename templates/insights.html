<title>¿Qué quieres saber hoy?</title>
<style>
/*__FONTS__*/
/* Layout: an analyst's desk — question board on top, one answer sheet below; values read left, the "why" opens under each. */
:root {
  --bg: #eef1ee; --panel: #fbfcfa; --ink: #1c2626; --muted: #5b6966; --line: #d3dbd6;
  --accent: #1f5c4a; --accent-soft: #dcebe4; --chip: #e3e9e5;
  --good: #1e7a4c; --good-bg: #dff1e6; --warn: #9a6a06; --warn-bg: #f7ecd0;
  --bad: #b3372b; --bad-bg: #f8dfdb; --na: #6b7672; --na-bg: #e7ebe9;
  --display: "WPA Sans", "DejaVu Sans", Verdana, system-ui, sans-serif;
  --body: "WPA Sans", "DejaVu Sans", Verdana, system-ui, sans-serif;
  --mono: "WPA Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121817; --panel: #1a2220; --ink: #e5ece8; --muted: #9baba5; --line: #2c3834;
  --accent: #7fcfb0; --accent-soft: #1f3a31; --chip: #222c29;
  --good: #7fd6a3; --good-bg: #183327; --warn: #e7c46b; --warn-bg: #3a3017; --bad: #f09a8f; --bad-bg: #3d1f1b;
  --na: #a3afab; --na-bg: #242d2a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121817; --panel: #1a2220; --ink: #e5ece8; --muted: #9baba5; --line: #2c3834;
  --accent: #7fcfb0; --accent-soft: #1f3a31; --chip: #222c29;
  --good: #7fd6a3; --good-bg: #183327; --warn: #e7c46b; --warn-bg: #3a3017; --bad: #f09a8f; --bad-bg: #3d1f1b;
  --na: #a3afab; --na-bg: #242d2a; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 22px; }
header { display: grid; gap: 10px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(28px, 5vw, 44px)/1.05 var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font: 700 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
h3 { font: 600 17px/1.3 var(--body); margin: 0; }
.source { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: var(--muted); }
.banner { border-left: 4px solid var(--warn); background: var(--warn-bg); color: var(--ink); padding: 10px 14px; border-radius: 6px; font-size: 14.5px; }
.banner.prod { border-color: var(--good); background: var(--good-bg); }
.ask { display: flex; gap: 8px; flex-wrap: wrap; }
.ask input { flex: 1 1 260px; min-width: 0; font: 16px var(--body); padding: 11px 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.ask button, .chip, .pill-btn { font: 600 15px var(--body); cursor: pointer; border-radius: var(--r); }
.ask button { padding: 11px 18px; border: 0; background: var(--accent); color: var(--panel); }
.questions { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.chip { text-align: left; padding: 12px 14px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); line-height: 1.3; }
.chip small { display: block; font: 400 13px var(--body); color: var(--muted); margin-top: 3px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip:focus-visible, .pill-btn:focus-visible, .ask button:focus-visible, .ask input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px clamp(16px, 3vw, 28px); display: grid; gap: 18px; min-width: 0; }
.lead { font-size: 18px; max-width: 65ch; margin: 0; }
.products { display: flex; flex-wrap: wrap; gap: 6px; }
.pill-btn { padding: 7px 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-weight: 500; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill-btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.rows { display: grid; gap: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 0; border-top: 1px solid var(--line); align-items: baseline; }
.row:first-child { border-top: 0; }
.row .label { font-weight: 600; min-width: 0; }
.row .val { font: 500 15px var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row details { grid-column: 1 / -1; }
summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; width: fit-content; }
details p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; max-width: 70ch; }
.tag { display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px var(--body); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.good { color: var(--good); background: var(--good-bg); } .warn { color: var(--warn); background: var(--warn-bg); }
.bad { color: var(--bad); background: var(--bad-bg); } .muted { color: var(--na); background: var(--na-bg); }
.bar { height: 8px; background: var(--na-bg); border-radius: 99px; overflow: hidden; margin-top: 6px; grid-column: 1 / -1; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font: 700 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13.5px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; max-width: 70ch; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 72ch; }
.note { font-size: 13.5px; color: var(--muted); max-width: 72ch; margin: 0; }
code { font: 13.5px var(--mono); background: var(--chip); padding: 2px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.copy { font: 600 13px var(--body); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; margin-left: 6px; }
@media (max-width: 520px) { .row { grid-template-columns: 1fr; } .row .val { text-align: left; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }

/* v2 layout: a workbench — sticky section tabs, a sortable product ledger, and one detail sheet per product. */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; border-bottom: 1px solid var(--line); }
.tab { font: 600 14.5px var(--body); padding: 9px 14px; border-radius: 999px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.cats { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px 10px; }
.cat { font: 600 14.5px var(--body); padding: 10px 14px; min-height: 44px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
.cat small { font: 500 12.5px var(--mono); color: var(--muted); margin-left: 6px; }
.cat[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cat:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tab:focus-visible, .th-btn:focus-visible, tr.click:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input, .tools select { font: 15px var(--body); padding: 9px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 0; }
.tools input { flex: 1 1 220px; }
.th-btn { all: unset; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
.th-btn[data-dir]::after { content: " ▾"; } .th-btn[data-dir="asc"]::after { content: " ▴"; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
td.name { max-width: 340px; min-width: 180px; } td.name small { display: block; color: var(--muted); font-size: 12.5px; }
.spark { display: inline-block; vertical-align: middle; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; } .grid2 > * { min-width: 0; display: grid; gap: 12px; align-content: start; }
.fbar { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 14.5px; }
.fbar .track { height: 18px; background: var(--na-bg); border-radius: 5px; overflow: hidden; } .fbar .track i { display: block; height: 100%; background: var(--accent); }
.fbar b { font: 600 14.5px var(--mono); font-variant-numeric: tabular-nums; }
.back { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14.5px; width: fit-content; }
.count { font: 500 13px var(--mono); color: var(--muted); }
h1 { font-size: clamp(24px, 4vw, 34px); }
@media (max-width: 520px) { .fbar { grid-template-columns: 1fr auto; } .fbar .track { grid-column: 1 / -1; order: 3; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Winning Product Agent · TikTok Shop US</div>
    <h1>¿Qué quieres saber hoy?</h1>
    <div class="source" id="source"></div>
  </header>
  <nav class="cats" id="cats" aria-label="Categorías"></nav>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
  <section class="sheet" id="view" aria-live="polite"></section>
  <p class="note" id="foot"></p>
</div>

<script>
const DATA = /*__INSIGHTS_DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (x) => String(x ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v, d = 1) => v === null || v === undefined || v === "" || Number.isNaN(+v) ? "N/A" :
  (Math.abs(+v) >= 1000 ? Math.round(+v).toLocaleString("es") : (+v).toLocaleString("es", { maximumFractionDigits: d }));
const money = (v) => v === null || v === undefined ? "N/A" : (+v >= 1000 ? Math.round(+v / 1000) + "k" : Math.round(+v));
const tag = (t, tone) => `<span class="tag ${tone}">${esc(t)}</span>`;
const why = (t, label = "¿Por qué?") => t ? `<details><summary>${label}</summary><p>${esc(t)}</p></details>` : "";
const row = (label, val, explain, extra = "") => `<div class="row"><div class="label">${label}</div><div class="val">${val}</div>${extra}${why(explain)}</div>`;
const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${esc(l)}</span></div>`;
const AMZ = { COMPLETA: "good", MEDIA: "good", PARCIAL: "warn", NO_VALIDADA: "muted" };
const amz = (a) => a ? tag(a.label, AMZ[a.level] || "muted") : tag("Sin dato", "muted");
const DEC = { "Listo para validar": "good", "Prometedor": "good", "En observación": "warn", "Descartado": "bad", "Datos insuficientes": "muted" };
const wpsTone = (w) => w == null ? "muted" : w >= 70 ? "good" : w >= 55 ? "warn" : "bad";
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const P0 = DATA ? DATA.products : [];
const C0 = DATA ? (DATA.candidates || []) : [];
const F0 = DATA ? (DATA.funnel || []) : [];
const G = DATA ? (DATA.groups || []) : [];
const byId = Object.fromEntries(P0.map((p) => [p.id, p]));
let grp = "", P = P0, C = C0, F = F0;
const isCand = (p) => ["PROMISING_NEEDS_VALIDATION", "READY_FOR_PRODUCT_VALIDATION"].includes(p.state);
function scope() { const f = (x) => !grp || x.group === grp; P = P0.filter(f); C = C0.filter(f); F = F0.filter(f); }
const TABS = [["resumen", "Resumen"], ["productos", "Productos"], ["embudo", "Embudo"], ["corridas", "Corridas"], ["sistema", "Sistema"]];
let tab = "resumen", product = null, q = "", fState = "", onlyDeep = false, sortKey = "wps", sortDir = "desc";

function spark(c) {
  const v = [c.revenue_61_90d, c.revenue_31_60d, c.revenue_last_30d];
  if (v.some((x) => x == null)) return `<span class="count">${money(v[1])} → ${money(v[2])}</span>`;
  const m = Math.max(...v, 1), pts = v.map((x, i) => `${4 + i * 26},${22 - (x / m) * 18}`).join(" ");
  const up = v[0] < v[1] && v[1] < v[2];
  return `<svg class="spark" width="60" height="26" viewBox="0 0 60 26" role="img" aria-label="Ventas ${money(v[0])}, ${money(v[1])}, ${money(v[2])} USD"><polyline points="${pts}" fill="none" stroke="var(--${up ? "good" : "warn"})" stroke-width="2"/><circle cx="56" cy="${22 - (v[2] / m) * 18}" r="3" fill="var(--${up ? "good" : "warn"})"/></svg> <span class="count">${money(v[2])}</span>`;
}

const V = {
  resumen() {
    const d = DATA, last = F[F.length - 1] || {};
    const prom = P.filter((p) => ["PROMISING_NEEDS_VALIDATION", "READY_FOR_PRODUCT_VALIDATION"].includes(p.state));
    const top = [...prom].sort((a, b) => (b.wps || 0) - (a.wps || 0)).slice(0, 5);
    const where = grp ? "en " + esc(grp) : "en todas las categorías analizadas";
    const lead = prom.length ? `<b>${prom.length}</b> producto(s) con potencial ${where}. Toca uno para ver su detalle.` : `Ningún producto alcanzó el puntaje mínimo (WPS 55) ${where}.`;
    const spent = F.reduce((s, f) => s + (f.credits || 0), 0);
    const perCat = !grp && G.length > 1 ? `<h3>Por categoría</h3><div class="table-wrap"><table><thead><tr><th>Categoría</th><th>Encontrados</th><th>Analizados</th><th>Candidatos</th><th>Mejor WPS</th><th>Créditos</th></tr></thead><tbody>${G.map((g) => { const ps = P0.filter((p) => p.group === g), cd = ps.filter(isCand), best = Math.max(...ps.map((p) => p.wps || 0), 0); return `<tr class="click" tabindex="0" data-grp="${esc(g)}"><td class="name">${esc(g)}</td><td class="num">${C0.filter((c) => c.group === g).length}</td><td class="num">${ps.length}</td><td class="num"><b>${cd.length}</b></td><td class="num">${best ? tag(num(best), wpsTone(best)) : "N/A"}</td><td class="num">${num(F0.filter((f) => f.group === g).reduce((s, f) => s + (f.credits || 0), 0))}</td></tr>`; }).join("")}</tbody></table></div>` : "";
    return `<h2>Resumen</h2><p class="lead">${lead}</p>
      <div class="stats">${stat(prom.length, "Candidatos (Prometedor o Listo)")}${stat(C.length || P.length, "Productos encontrados")}${stat(P.length, "Analizados a fondo")}${stat(num(spent), grp ? "Créditos en esta categoría" : "Créditos en estas corridas")}${stat(num(d.balance), "Saldo de créditos")}</div>
      ${perCat}
      ${top.length ? `<h3>Mejores candidatos</h3><div class="rows">${top.map((p) => `<div class="row"><div class="label"><button class="back" data-p="${esc(p.id)}">${esc(p.name.slice(0, 70))}</button>${!grp && p.group ? ` <span class="note">${esc(p.group)}</span>` : ""}</div><div class="val">WPS ${num(p.wps)} ${amz(p.amazon)}</div></div>`).join("")}</div>` : ""}
      ${d.audit && d.audit.issues.length ? `<h3>Avisos de la auditoría</h3><ul class="plain">${d.audit.issues.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
      ${(d.recommendations || []).length ? `<h3>Qué puede mejorar</h3><ul class="plain">${d.recommendations.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
      ${why("WPS (0–100) mide la fuerza del producto en TikTok Shop: 55 es aceptable y 70 es fuerte. Prometedor = buen puntaje sin alertas negativas. La etiqueta de Amazon es informativa y nunca descarta un producto.", "¿Cómo leer esto?")}`;
  },
  productos() {
    if (product && byId[product]) return V.detalle(byId[product]);
    const src = C.length ? C : P.map((p) => ({ product_id: p.id, product_name: p.name, category: p.category, wps: p.wps, decision: p.state_es, deep_analyzed: true, units_30d: p.units, amazon: p.amazon && p.amazon.label }));
    const states = [...new Set(src.map((c) => c.decision).filter(Boolean))];
    let rows = src.filter((c) => (!q || (c.product_name || "").toLowerCase().includes(q.toLowerCase())) && (!fState || c.decision === fState) && (!onlyDeep || c.deep_analyzed));
    const val = (c) => sortKey === "name" ? (c.product_name || "").toLowerCase() : (c[sortKey] ?? -Infinity);
    rows.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * (sortDir === "asc" ? 1 : -1));
    const th = (k, l, cls = "") => `<th class="${cls}" aria-sort="${sortKey === k ? (sortDir === "asc" ? "ascending" : "descending") : "none"}"><button class="th-btn" data-sort="${k}" ${sortKey === k ? `data-dir="${sortDir}"` : ""}>${l}</button></th>`;
    const body = rows.map((c) => { const has = byId[c.product_id];
      return `<tr class="${has ? "click" : ""}" ${has ? `tabindex="0" data-p="${esc(c.product_id)}"` : ""}><td class="name">${esc((c.product_name || "").slice(0, 80))}<small>${!grp && c.group ? esc(c.group) + " · " : ""}${esc((c.category || "").split(">").pop().trim())}${c.lens ? " · " + esc(c.lens.split(":").pop().split(":")[0].slice(0, 28)) : ""}</small></td>
        <td>${c.decision ? tag(c.decision, DEC[c.decision] || "muted") : tag(c.deep_analyzed ? "Análisis fallido" : "Sin analizar", "muted")}</td>
        <td class="num">${c.wps != null ? tag(num(c.wps), wpsTone(c.wps)) : "N/A"}</td><td class="num">${num(c.preliminary_score)}</td>
        <td>${spark(c)}</td><td class="num">${num(c.units_30d, 0)}</td><td class="num">${num(c.avg_order_value_proxy)}${c.price_vs_aov_flag === "REVISAR" ? " " + tag("≠ lista", "warn") : ""}</td><td class="num">${num(c.creators, 0)}</td></tr>`; }).join("");
    return `<h2>Productos</h2>
      <div class="tools"><input id="search" type="search" placeholder="Buscar producto…" value="${esc(q)}" aria-label="Buscar producto">
        <select id="fstate" aria-label="Filtrar por decisión"><option value="">Todas las decisiones</option>${states.map((s) => `<option ${s === fState ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <label style="font-size:14.5px"><input id="fdeep" type="checkbox" ${onlyDeep ? "checked" : ""}> Solo analizados a fondo</label>
        <span class="count">${rows.length} de ${src.length}</span></div>
      <div class="table-wrap"><table><thead><tr>${th("name", "Producto")}${th("decision", "Decisión")}${th("wps", "WPS")}${th("preliminary_score", "Preliminar")}${th("revenue_last_30d", "Ventas 90→30 d")}${th("units_30d", "Unidades")}${th("avg_order_value_proxy", "Ingreso/unidad")}${th("creators", "Creadores")}</tr></thead><tbody>${body || `<tr><td colspan="8">Ningún producto coincide con el filtro.</td></tr>`}</tbody></table></div>
      <p class="note">Toca el encabezado de una columna para ordenar. Toca un producto analizado para ver su detalle. La línea muestra las ventas de 61–90, 31–60 y últimos 30 días (verde = crecimiento sostenido). Ingreso/unidad = ventas ÷ unidades de 30 días (USD); «≠ lista» indica que queda fuera del precio publicado.</p>`;
  },
  detalle(p) {
    const c = C0.find((x) => x.product_id === p.id) || {};
    const comps = p.wps_components.map((k) => { const pct = k.points == null ? 0 : Math.max(0, Math.min(100, k.points / k.max * 100));
      return row(`${esc(k.metric)} <span class="note">(${k.tier === "CORE" ? "principal" : "de apoyo"})</span>`, k.points == null ? "N/A" : `${num(k.points, 2)} / ${num(k.max)}`, k.why, `<div class="bar"><i style="width:${pct}%"></i></div>`); }).join("");
    const dims = p.dimensions.map((d) => row(esc(d.dimension), tag(d.status, d.tone), d.why)).join("");
    return `<button class="back" id="back">← Todos los productos</button><h2>${esc(p.name)}</h2>
      <p class="lead">${tag(p.state_es, p.tone)} · WPS <b>${num(p.wps)}</b> · ${amz(p.amazon)}</p>${why(p.state_why + " " + p.dc_why + (p.amazon ? " Amazon: " + p.amazon.reason + "." : ""))}
      <div class="stats">${stat(num(p.gmv, 0), "Ventas 30 días (USD)")}${stat(num(p.units, 0), "Unidades 30 días")}${stat(num(p.price), "Precio promedio (USD)")}${stat(num(p.creators, 0) + " / " + num(p.videos, 0), "Creadores / videos")}${stat(num(p.wps_confidence), "Confianza de datos")}${c.avg_order_value_proxy != null ? stat(num(c.avg_order_value_proxy), "Ingreso real por unidad (USD)") : ""}${c.wps_coverage_pct != null ? stat(num(c.wps_floor) + " · " + num(c.wps_coverage_pct, 0) + " %", "WPS piso · cobertura") : ""}</div>
      ${c.supplier_estimate ? `<p class="note">Proveedor (solo referencia): ${esc(c.supplier_estimate)}</p>` : ""}
      <div class="grid2"><div><h3>Puntaje WPS, componente por componente</h3><div class="rows">${comps}</div></div>
      <div><h3>Dimensiones de la decisión</h3><div class="rows">${dims}</div>
      ${p.flags.length ? `<h3>Alertas</h3><ul class="plain">${p.flags.map((f) => `<li>${esc(f.es)}</li>`).join("")}</ul>` : ""}
      ${p.next_actions.length ? `<h3>Siguientes pasos</h3><ol class="steps">${p.next_actions.map((a) => `<li>${esc(a)}</li>`).join("")}</ol>` : ""}</div></div>
      ${c.product_url ? `<p class="note"><a href="${esc(c.product_url)}" target="_blank" rel="noopener">Ver en TikTok Shop</a></p>` : ""}`;
  },
  embudo() {
    const f = F[F.length - 1];
    if (!f) return `<h2>Embudo</h2><p class="lead">Todavía no hay corridas de producción.</p>`;
    const st = [["Registros recibidos", f.records], ["Pasan los filtros", (f.pass || 0) + (f.review || 0)], ["Candidatos conservados", f.candidates_kept], ["Análisis profundo completo", f.deep_ok], ["Califican (WPS ≥ 55)", f.qualified], ["Prometedor o Listo", (f.states.PROMISING_NEEDS_VALIDATION || 0) + (f.states.READY_FOR_PRODUCT_VALIDATION || 0)]];
    const max = Math.max(...st.map((x) => x[1] || 0), 1);
    const w = f.wps.filter((x) => x != null), bins = Array.from({ length: 10 }, (_, i) => w.filter((x) => x >= i * 10 && x < i * 10 + 10).length), bm = Math.max(...bins, 1);
    return `<h2>Embudo de la última corrida${f.group ? " · " + esc(f.group) : ""}</h2><p class="lead">De <b>${num(f.records, 0)}</b> productos recibidos quedaron <b>${f.qualified}</b> que califican. Tasa de acierto del análisis profundo: <b>${f.hit_rate == null ? "N/A" : Math.round(f.hit_rate * 100) + " %"}</b>.</p>
      <div>${st.map(([l, v]) => `<div class="fbar"><span>${l}</span><div class="track"><i style="width:${(v || 0) / max * 100}%"></i></div><b>${num(v, 0)}</b></div>`).join("")}</div>
      <div class="grid2"><div><h3>Por qué se detuvieron o marcaron</h3>${f.filter_reasons.length ? `<div class="rows">${f.filter_reasons.map(([r, n]) => row(esc(r.replace(/_/g, " ")), n)).join("")}</div>` : `<p class="note">Ningún producto fue detenido por los filtros.</p>`}
        <p class="note">Búsquedas: ${f.answers_ok} útiles de ${f.queries}. Análisis fallidos: ${f.deep_failed}. No ejecutados: ${f.deep_not_run}${f.target ? ` (se detuvo al llegar a ${f.target})` : ""}.</p></div>
      <div><h3>Distribución del WPS</h3><div>${bins.map((n, i) => `<div class="fbar"><span>${i * 10}–${i * 10 + 9}${i === 5 ? " · aceptable" : i === 7 ? " · fuerte" : ""}</span><div class="track"><i style="width:${n / bm * 100}%;background:var(--${i >= 7 ? "good" : i >= 5 ? "warn" : "na"})"></i></div><b>${n}</b></div>`).join("")}</div></div></div>`;
  },
  corridas() {
    const rows = F.map((f) => `<tr><td>${esc(f.run_id.slice(0, 8).replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3"))}</td><td>${esc(f.group || "N/A")}</td><td>${esc(f.config)}</td><td class="num">${num(f.records, 0)}</td><td class="num">${f.deep_ok}</td><td class="num"><b>${f.qualified}</b></td><td class="num">${f.hit_rate == null ? "N/A" : Math.round(f.hit_rate * 100) + " %"}</td><td class="num">${num(f.credits)}</td><td class="num">${num(f.credits_per_candidate)}</td></tr>`).join("");
    const c = DATA.costs, total = c.reduce((s, r) => s + (r.creditos || 0), 0);
    return `<h2>Corridas comparadas</h2><div class="stats">${stat(num(DATA.balance), "Saldo actual")}${stat(num(total), "Créditos gastados en total")}${stat(F.length, "Corridas de producción")}</div>
      <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Configuración</th><th>Registros</th><th>Analizados</th><th>Candidatos</th><th>Acierto</th><th>Créditos</th><th>Créditos por candidato</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${why("Créditos por candidato es la medida de eficiencia: cuánto costó encontrar cada producto con WPS de 55 o más. Mientras más bajo, mejor funciona la búsqueda.", "¿Qué comparar?")}
      <h3>Todas las consultas pagadas</h3><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Resultado</th><th>Consultas</th><th>Créditos</th><th>Saldo final</th></tr></thead><tbody>${c.map((r) => `<tr><td>${esc(r.fecha)}</td><td>${esc(r.tipo)}</td><td>${esc(r.estado)}</td><td class="num">${r.consultas_pagadas}</td><td class="num">${num(r.creditos)}</td><td class="num">${num(r.saldo_fin)}</td></tr>`).join("")}</tbody></table></div>`;
  },
  sistema() {
    const h = DATA.health, q2 = DATA.data_quality, es = { RELIABLE: ["Confiable", "good"], USABLE: ["Usable", "warn"], SPARSE: ["Escaso", "bad"], UNRELIABLE: ["No confiable", "bad"] };
    const comps = Object.entries(h.components || {}), bad = comps.filter(([, v]) => v !== "READY");
    return `<h2>Sistema</h2><div class="stats">${stat(esc(h.config.version || "N/A"), "Configuración activa")}${stat(h.config.hashes_ok ? "Sin cambios" : "Alterada", "Integridad de la configuración")}${stat(`${comps.length - bad.length}/${comps.length}`, "Componentes listos")}</div>
      ${bad.length ? `<ul class="plain">${bad.map(([k, v]) => `<li>${esc(k)}: ${esc(v)}</li>`).join("")}</ul>` : ""}
      ${DATA.audit ? `<h3>Auditoría de la última corrida</h3><div class="rows">${row("Resultado", tag(DATA.audit.result === "RUN_VALIDATED" ? "Validada" : "Requiere revisión", DATA.audit.result === "RUN_VALIDATED" ? "good" : "warn"), DATA.audit.issues.join(" ") || "Todos los chequeos pasaron.")}</div>` : ""}
      <h3>Disponibilidad de los datos</h3><div class="rows">${q2.map((r) => row(esc(r.campo.replace("Deep · ", "Análisis · ").replace("Discovery · ", "Búsqueda · ")), `${r.disponible}/${r.total} ${tag((es[r.estado] || [r.estado])[0], (es[r.estado] || [0, "muted"])[1])}`)).join("")}</div>
      <p class="note">Lo que falta aparece como N/A: el sistema nunca estima ni inventa valores.</p>`;
  },
};

function render() {
  scope();
  $("#cats").innerHTML = G.length > 1 ? [["", "Todas"]].concat(G.map((g) => [g, g])).map(([k, l]) => `<button class="cat" aria-pressed="${k === grp}" data-grp="${esc(k)}">${esc(l)}<small>${(k ? P0.filter((p) => p.group === k) : P0).filter(isCand).length} candidatos</small></button>`).join("") : "";
  store.set("wpa-grp", grp);
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === tab}" data-tab="${k}">${l}</button>`).join("");
  $("#view").innerHTML = V[tab]();
  store.set("wpa-tab", tab);
}
function go(t, pid) { tab = t; product = pid || null; history.replaceState(null, "", "#" + t); render(); window.scrollTo({ top: 0 }); }

if (!DATA) { $("#view").innerHTML = "<h2>Sin datos</h2><p class='lead'>Genera la página con el comando insights.</p>"; }
else {
  $("#source").innerHTML = `<span>${esc(DATA.source_label)}</span><span>Config ${esc(DATA.config_version || "N/A")}</span><span>Actualizado ${new Date(DATA.generated_at).toLocaleString("es")}</span>`;
  $("#foot").textContent = "Esta página solo muestra datos. No hace consultas pagadas, no pide muestras, no contacta proveedores y no gasta en anuncios.";
  const h = location.hash.slice(1); tab = V[h] && h !== "detalle" ? h : (V[store.get("wpa-tab", "")] ? store.get("wpa-tab", "resumen") : "resumen"); if (tab === "detalle") tab = "resumen";
  grp = G.includes(store.get("wpa-grp", "")) ? store.get("wpa-grp", "") : "";
  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-grp]"); if (g) { grp = g.dataset.grp; fState = ""; return go(tab === "productos" ? "productos" : tab); }
    const t = e.target.closest("[data-tab]"); if (t) return go(t.dataset.tab);
    const s = e.target.closest("[data-sort]"); if (s) { const k = s.dataset.sort; sortDir = sortKey === k && sortDir === "desc" ? "asc" : "desc"; sortKey = k; return render(); }
    const p = e.target.closest("[data-p]"); if (p) return go("productos", p.dataset.p);
    if (e.target.id === "back") return go("productos");
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr.click")) { if (e.target.dataset.grp) { grp = e.target.dataset.grp; go(tab); } else go("productos", e.target.dataset.p); } });
  document.addEventListener("input", (e) => {
    if (e.target.id === "search") { q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#search"); n.focus(); n.setSelectionRange(pos, pos); }
    if (e.target.id === "fstate") { fState = e.target.value; render(); }
    if (e.target.id === "fdeep") { onlyDeep = e.target.checked; render(); }
  });
  render();
}
</script>
