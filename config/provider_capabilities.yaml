# =============================================================================
# KaloPilot provider capability matrix (Step U post-live calibration)
# =============================================================================
# Built ONLY from the real first live runs (nothing guessed):
#   Discovery: 30 records  (Home 2026-09-29, 15 + Beauty & Personal Care 2026-09-30, 15)
#   Deep Analysis: 5 records (Beauty & Personal Care, run 20260930T134127Z_547f9f)
# Counts are "records with a usable value / records". Small samples: re-check after more runs.
#
#   RELIABLY_AVAILABLE   returned in every observed record
#   SOMETIMES_AVAILABLE  returned in some records
#   NOT_AVAILABLE        never returned in any observed record
#   DERIVED              calculated by our code from provider fields (never asked from the provider)
#
# Rules (enforced by tests/test_calibration_fixes.py):
#   - CORE WPS metrics may only use RELIABLY_AVAILABLE or DERIVED fields.
#   - SOMETIMES / NOT_AVAILABLE fields are SUPPORTING or ENHANCEMENT: missing -> lower Confidence,
#     never an automatic rejection.
# =============================================================================
provider: kalopilot
observed:
  discovery_records: 30
  deep_records: 5
  runs: ["20260930T014532Z home discovery", "task 2a294a47 beauty discovery", "20260930T134127Z_547f9f deep"]

fields:
  RELIABLY_AVAILABLE:
    # discovery 30/30 and deep 5/5
    - product_id
    - product_name
    - product_url
    - shop_id
    - shop_name
    - category_path
    - category_id                # NOTE: returned as the TOP-level category id (601450 = Beauty), not the leaf
    - price_min
    - price_max
    - gmv_30d
    - units_30d
    - creator_count
    - video_count
    - launch_date
    - data_window_end
    # deep only (5/5)
    - selling_creator_count
    - selling_video_count
    - video_sales_share_pct
    - commission_pct
    - category_growth_pct        # scope as returned; level not stated
    - category_product_count     # 5/5 present, but its LEVEL varied (211,238 vs 467–8,347): see competition_scope
    - daily_gmv                  # 30–31 daily points in 5/5
    - top_creators               # list present 5/5 (see top_creators_growth below)
  SOMETIMES_AVAILABLE:
    - growth_30d_pct             # deep 4/5 (discovery 30/30, but discovery values were wrong by ~100x)
    - creator_growth_pct         # deep 3/5, discovery 0/30
    - video_growth_pct           # deep 2/5, discovery 0/30
    - shop_count                 # deep 3/5, discovery 0/30
    - top_videos                 # deep 4/5; videos with revenue: 3, 0, 9, 10, 1
    - top_creators_growth        # creators with growth_pct: 4, 1, 5, 10, 2  (>= 3 needed: 3/5)
  NOT_AVAILABLE:
    - similar_listings_count     # deep 0/5
    - daily_units                # deep 0/5
    - daily_creator_count        # deep 0/5
    - daily_video_count          # deep 0/5
    - price_history              # deep 0/5
    - selling_creator_count_discovery   # discovery 0/30 (deep has it)
  DERIVED:
    - price_avg                  # (price_min + price_max) / 2
    - growth_30d_calculated      # (gmv_30d - gmv_prev_30d) / gmv_prev_30d * 100 when gmv_prev_30d is returned
    - recent_velocity_pct        # from daily_gmv (last 7 days vs previous 7)
    - acceleration_pp            # from daily_gmv (velocity change)
    - daily_sales_cv             # from daily_gmv (trend stability)
    - concentration_shares       # from top_creators / top_videos revenue

# Requested since Step U but NOT yet observed in any live answer (status decided after the next run):
pending_observation:
  - gmv_prev_30d
  - category_product_count_level
  - leaf_category_id

# Provider behaviour observed live
behaviour:
  plan_restriction_pause: "Category Overview not included in Professional plan -> task pauses, API says completed with message_id 0"
  answer_output_limit_tokens: 8000     # a 5-product deep batch returned empty text at 8,001 output tokens
  deep_cost_per_product_credits: [1.69, 2.48]   # observed range, 1 product per query
  discovery_cost_credits: [1.67, 3.98]          # observed (Beauty continued in web UI; Home)

# WPS input -> provider field it depends on (used to check CORE metrics only use reliable data)
wps_input_to_field:
  revenue_growth_pct: growth_30d_calculated     # CORE: calculated when gmv_prev_30d exists; else provider (flagged)
  recent_velocity_pct: recent_velocity_pct
  acceleration_pp: acceleration_pp
  units_sold: units_30d
  videos_count: video_count
  video_sales_share_pct: video_sales_share_pct
  creators_count: creator_count
  top_creators_growth_pct: top_creators_growth
  category_growth_pct: category_growth_pct
  competition_count_comparable: category_product_count
  price_avg: price_avg
  commission_pct: commission_pct
  daily_sales_series: daily_gmv
